[versions]
# Android
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
agp = "9.2.1"

# Kotlin — 2.4.10 je VYNUCENÁ hodnota, ne volba. `dev.g000sha256:tdl-coroutines:15.0.0` je
# publikovaný z Kotlinu 2.4.10 a jeho iOS klib se starším kompilátorem nenačte. Při bumpu TDLib
# wrapperu vždycky zkontroluj Kotlin verzi v jeho Gradle metadatech:
#   curl -s https://repo1.maven.org/maven2/dev/g000sha256/tdl-coroutines-iosarm64/<ver>/tdl-coroutines-iosarm64-<ver>.module | grep -A2 kotlin-stdlib
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"

# Compose — verze převzaté z mlogu (ověřená kombinace). material3 musí být ALPHA kanál, jinak
# z artefaktu vypadnou všechna API pod @ExperimentalMaterial3ExpressiveApi (MaterialExpressiveTheme,
# MotionScheme, LoadingIndicator, WideNavigationRail, …) a expressive vrstva se nezkompiluje.
compose = "1.12.0"
material3 = "1.12.0-alpha03"
androidx-adaptive = "1.3.0-beta02"
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
androidx-browser = "1.10.0"
androidx-lifecycle = "2.11.0"
navigation = "1.1.1"

# Ostatní
koin = "4.2.2"
materialkolor = "4.1.1"
kermit = "2.1.0"
zxing = "3.5.3"
coil = "3.5.0"
# Nastavení aplikace. Preferences-core je multiplatformní (Android i iOS) a nepotřebuje Context.
datastore = "1.2.1"
# Animované samolepky (.tgs = gzipovaná Lottie). Compottie táhne `foundation` tranzitivně
# a novější verze než náš Compose by ho tiše povýšila mimo ověřenou kombinaci s material3 alphou.
# Při bumpu zkontroluj `foundation` v jejích metadatech (.module na Maven Central).
compottie = "2.3.1"
# Gzip pro .tgs. Tutéž verzi táhne Compottie; výslovně kvůli tomu, že ji používáme přímo.
okio = "3.16.4"
# Rozostřené pozadí pod plovoucími vrstvami (závoj nabídky nad zprávou). Compose sám umí rozostřit
# jen vlastní obsah (`Modifier.blur`), ne to, co leží POD vrstvou. Kotlin projektu musí být ≥ tomu,
# ze kterého je Haze publikovaná — při bumpu zkontroluj `kotlin-stdlib` a `compose.ui` v jejích
# metadatech (.module na Maven Central). `haze` a `haze-blur` musí mít vždy stejnou verzi.
haze = "2.0.0-rc02"
# Přehrávání videa na Androidu. Jen `exoplayer` + `ui` (AspectRatioFrameLayout): `ui-compose` by táhl
# androidx Compose novější, než jakou verzi drží Compose Multiplatform.
media3 = "1.11.1"
# Nahrávání video koleček (core/camera). Jen Android; iOS má AVFoundation.
camerax = "1.6.2"
# Vestavěný výběr fotek (Android 14 + SDK Extensions 15). Alpha: API se ještě může změnit,
# proto je za `expect`/`actual` a bez něj funguje dál klasický Photo Picker.
androidx-photopicker = "1.0.0-alpha02"
buildconfig = "6.0.10"
googleServices = "4.4.4"
firebaseBom = "34.4.0"
# Dočekání na odloženou notifikaci po pushi (expedited úloha); proces v ní systém nezmrazí.
work = "2.11.2"
glance = "1.2.0"
# Gradle plugin Crashlytics — nahrává R8 mapping soubor a vkládá do APK build id, podle kterého
# konzole hlášení spáruje. Verze pluginu je na firebaseBom NEZÁVISLÁ (jiný release cyklus).
crashlytics = "3.0.8"
# Play In-App Updates (karta s aktualizací v seznamu chatů). Jen základní artefakt, ne `-ktx`:
# stačí Task API a ktx by táhl coroutines-play-services kvůli dvěma voláním.
playAppUpdate = "2.1.0"
# Čtečka QR kódů (přihlášení jiného zařízení). Google code scanner: skenovací obrazovku dodá
# Play služby, aplikace nepotřebuje oprávnění ke kameře ani vlastní CameraX + ML Kit.
playCodeScanner = "16.1.0"
# Gemini Nano v zařízení (AICore) přes ML Kit Prompt API — viz core/ai. Beta, API se může měnit.
# Verze je převzatá z oficiální ukázky googlesamples/mlkit (android/genai).
mlkitGenaiPrompt = "1.0.0-beta4"
# Gemma v zařízení přes LiteRT-LM — druhý poskytovatel vedle Gemini Nano, viz core/ai.
# Verze je převzatá z Google AI Edge Gallery (Android/src/gradle/libs.versions.toml); tagy na
# GitHubu (v0.9.0) s verzemi na Google Maven nesedí, takže se neberou odtud.
litertlm = "0.11.0"

# TDLib wrapper. Upstream TDLib dělá breaking changes i v patch verzích — proto je celý wrapper
# schovaný za :client:shared/core/telegram a nikde jinde se jeho typy neobjevují.
tdl = "15.0.0"
# Hledání memory leaků v debug buildu (jen `debugImplementation` ve vstupním bodu). 3.0 je zatím
# alpha; 2.14 je poslední stabilní.
leakcanary = "2.14"
# Composition tracing (jen debug): každá composable je v trace Perfetto vlastní řez. Verze musí
# sedět s androidx Compose runtime, na který se JetBrains Compose mapuje (1.12.0), jinak ho povýší.
compose-runtime-tracing = "1.12.0"
# Nativní knihovna Perfetto SDK přibalená do APK, ať se nemusí do zařízení nahrávat zvlášť.
tracing-perfetto = "1.0.1"

[libraries]
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
compose-runtime-tracing = { module = "androidx.compose.runtime:runtime-tracing", version.ref = "compose-runtime-tracing" }
tracing-perfetto-binary = { module = "androidx.tracing:tracing-perfetto-binary", version.ref = "tracing-perfetto" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# --- Compose ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }

androidx-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "androidx-adaptive" }
androidx-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "androidx-adaptive" }
androidx-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "androidx-adaptive" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
navigation = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation" }

# --- Koin ---
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-navigation3 = { module = "io.insert-koin:koin-compose-navigation3" }

# --- Ostatní ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
compottie-lite = { module = "io.github.alexzhirkevich:compottie-lite", version.ref = "compottie" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
androidx-photopicker-compose = { module = "androidx.photopicker:photopicker-compose", version.ref = "androidx-photopicker" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "mlkitGenaiPrompt" }
play-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "playCodeScanner" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

tdl-coroutines = { module = "dev.g000sha256:tdl-coroutines", version.ref = "tdl" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
