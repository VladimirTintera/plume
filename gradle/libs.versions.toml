[versions]
# Android
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
agp = "9.2.1"

# Kotlin — 2.4.21 je VYNUCENÁ hodnota, ne volba. `dev.g000sha256:tdl-coroutines:17.0.0` je
# publikovaný z Kotlinu 2.4.21 a jeho iOS klib se starším kompilátorem nenačte. Při bumpu TDLib
# wrapperu vždycky zkontroluj Kotlin verzi v jeho Gradle metadatech:
#   curl -s https://repo1.maven.org/maven2/dev/g000sha256/tdl-coroutines-iosarm64/<ver>/tdl-coroutines-iosarm64-<ver>.module | grep -A2 kotlin-stdlib
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"

# Compose — verze převzaté z mlogu (ověřená kombinace). material3 musí být ALPHA kanál, jinak
# z artefaktu vypadnou všechna API pod @ExperimentalMaterial3ExpressiveApi (MaterialExpressiveTheme,
# MotionScheme, LoadingIndicator, WideNavigationRail, …) a expressive vrstva se nezkompiluje.
compose = "1.12.0"
material3 = "1.12.0-alpha03"
androidx-adaptive = "1.3.0-beta02"
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
androidx-browser = "1.10.0"
# Hovory (sonda): mediální vrstva nad WebRTC, LGPL-3.0, dynamicky linkovaná `.so`
# (docs/poznatky/hovory.md). Jen Android.
ntgcalls = "3.0.3"
# JNA: vazba desktopu na C API ntgcalls (hovory, docs/poznatky/hovory.md, „Desktop").
jna = "5.19.1"
# FFmpeg přes JavaCPP: dekodér videa na desktopu (GIFy, docs/poznatky/desktop.md, „Video").
# LGPL build, dynamicky linkované knihovny. Verze FFmpegu a JavaCPP jdou spolu (`<ffmpeg>-<javacpp>`).
javacpp = "1.5.14"
ffmpeg = "8.1.2-1.5.14"
# Titulek okna na desktopu v barvách motivu (tmavý režim DWM na Windows, vzhled na macOS).
platformtools = "0.7.5"
# Hovory napojené na systémový telefon (Telecom / ConnectionService) — docs/poznatky/hovory.md.
androidx-core-telecom = "1.0.1"
androidx-lifecycle = "2.11.0"
navigation = "1.1.1"

# Ostatní
koin = "4.2.2"
materialkolor = "4.1.1"
kermit = "2.1.0"
zxing = "3.5.3"
# Wear OS (client/wearApp): Compose for Wear OS a výchozí knihovny hodinek.
wear-compose = "1.7.1"
wear-input = "1.2.0"
wear-phone-interactions = "1.1.1"
wear-remote-interactions = "1.2.0"
# Dlaždice a komplikace hodinek (počet nepřečtených).
wear-tiles = "1.6.2"
wear-protolayout = "1.4.2"
wear-complications = "1.3.0"
concurrent-futures = "1.3.0"
coil = "3.5.0"
# Nastavení aplikace. Preferences-core je multiplatformní (Android i iOS) a nepotřebuje Context.
datastore = "1.2.1"
# Animované samolepky (.tgs = gzipovaná Lottie). Compottie táhne `foundation` tranzitivně
# a novější verze než náš Compose by ho tiše povýšila mimo ověřenou kombinaci s material3 alphou.
# Při bumpu zkontroluj `foundation` v jejích metadatech (.module na Maven Central).
compottie = "2.3.1"
# Gzip pro .tgs. Tutéž verzi táhne Compottie; výslovně kvůli tomu, že ji používáme přímo.
okio = "3.16.4"
# Rozostřené pozadí pod plovoucími vrstvami (závoj nabídky nad zprávou). Compose sám umí rozostřit
# jen vlastní obsah (`Modifier.blur`), ne to, co leží POD vrstvou. Kotlin projektu musí být ≥ tomu,
# ze kterého je Haze publikovaná — při bumpu zkontroluj `kotlin-stdlib` a `compose.ui` v jejích
# metadatech (.module na Maven Central). `haze` a `haze-blur` musí mít vždy stejnou verzi.
haze = "2.0.0-rc02"
# Přehrávání videa na Androidu. Jen `exoplayer` + `ui` (AspectRatioFrameLayout): `ui-compose` by táhl
# androidx Compose novější, než jakou verzi drží Compose Multiplatform.
media3 = "1.11.1"
# Nahrávání video koleček (core/camera). Jen Android; iOS má AVFoundation.
camerax = "1.6.2"
# Vestavěný výběr fotek (Android 14 + SDK Extensions 15). Alpha: API se ještě může změnit,
# proto je za `expect`/`actual` a bez něj funguje dál klasický Photo Picker.
androidx-photopicker = "1.0.0-alpha02"
buildconfig = "6.0.10"
googleServices = "4.4.4"
firebaseBom = "34.4.0"
# Dočekání na odloženou notifikaci po pushi (expedited úloha); proces v ní systém nezmrazí.
work = "2.11.2"
glance = "1.2.0"
# Gradle plugin Crashlytics — nahrává R8 mapping soubor a vkládá do APK build id, podle kterého
# konzole hlášení spáruje. Verze pluginu je na firebaseBom NEZÁVISLÁ (jiný release cyklus).
crashlytics = "3.0.8"
# Play In-App Updates (karta s aktualizací v seznamu chatů). Jen základní artefakt, ne `-ktx`:
# stačí Task API a ktx by táhl coroutines-play-services kvůli dvěma voláním.
playAppUpdate = "2.1.0"
# Play Feature Delivery: runtime LiteRT-LM (:client:litertFeature) se stahuje z Play až na požádání,
# viz core/ai/PlayLiteRtRuntime. Jen základní artefakt s Task API, stejná úvaha jako playAppUpdate.
playFeatureDelivery = "2.1.0"
# Čtečka QR kódů (přihlášení jiného zařízení). Google code scanner: skenovací obrazovku dodá
# Play služby, aplikace nepotřebuje oprávnění ke kameře ani vlastní CameraX + ML Kit.
playCodeScanner = "16.1.0"
# Wearable Data Layer: hodinky pošlou přihlašovací odkaz telefonu, ten ho potvrdí (core/wear/WatchLogin).
# Jen základní artefakt s Task API, bez coroutines-play-services (stejná úvaha jako playAppUpdate).
playServicesWearable = "19.0.0"
# Text z fotky v prohlížeči médií (core/ocr). Varianta z Play služeb, ne `com.google.mlkit:text-recognition`:
# model latinky si stáhnou Play služby (meta-data `ocr` v manifestu), APK nenaroste o jeho ~4 MB na ABI.
playTextRecognition = "19.0.1"
# Odstranění pozadí při tvorbě samolepky (core/stickers). Varianta z Play služeb, model se stahuje
# jako u čtení textu (meta-data `subject_segment`). Beta — jiná verze zatím není.
playSubjectSegmentation = "16.0.0-beta1"
# Překlad v telefonu (core/translation). Jen API; jazykové modely se stahují za běhu na pokyn uživatele.
mlkitTranslate = "17.0.3"
# Gemini Nano v zařízení (AICore) přes ML Kit Prompt API — viz core/ai. Beta, API se může měnit.
# beta5 kvůli preview variantě: beta4 jí pro část požadavků přidělila featuru AICore -1 a tiše
# jela stabilním modelem (docs/poznatky/ai-v-zarizeni.md, „Dva poskytovatelé: Gemini Nano a Gemma").
mlkitGenaiPrompt = "1.0.0-beta5"
# Anotace a popis tvaru pro strukturovaný výstup Prompt API (`GenerableProvider`). Procesor KSP
# (`genai-schema-compiler`) se nepoužívá — providery jsou psané ručně, viz core/ai. Verze, kterou
# chce `genai-prompt` (beta5 → alpha2), jinak by ji Gradle stejně zvedl.
mlkitGenaiSchema = "1.0.0-alpha2"
# Gemma a Qwen v zařízení přes LiteRT-LM — vedle Gemini Nano, viz core/ai. Dřív verze z Google
# AI Edge Gallery (0.11.0); 0.19 kvůli souboru Qwen3 4B, jehož GPU cesta starší verzi shodí
# (docs/poznatky/ai-v-zarizeni.md, „Qwen a další modely přes LiteRT-LM"). Verze se berou
# z Google Maven (maven-metadata.xml), tagy na GitHubu s nimi nesedí.
litertlm = "0.19.1"
# Gson NATVRDO pod 2.14, jinak padá strukturovaný výstup Gemini Nano. LiteRT-LM 0.19.1 si táhne
# Gson 2.14.0 a ten přinesl třídu `com.google.gson.internal.bind.JavaTimeTypeAdapters`. Gson
# přibalený v ML Kitu (`genai-prompt` 1.0.0-beta4 i beta5, přejmenovaný do `mlkit_genai_prompt`) ji hledá
# `Class.forName` pod PŮVODNÍM jménem — přejmenování řetězec minulo —, najde tu cizí a přetypování
# na svou kopii vyhodí `ClassCastException` v inicializaci třídy. Chytá jen nenalezení, takže
# s 2.13.x (třída tam není) jede dál. LiteRT-LM bere jen stromové API (`JsonParser`, `JsonObject`),
# které 2.13.2 má — tu měl i LiteRT-LM 0.11.0. Hlídá `GsonForMlKitTest`; pryč až s opraveným ML Kitem.
gson = { strictly = "2.13.2" }

# TDLib wrapper. Upstream TDLib dělá breaking changes i v patch verzích — proto je celý wrapper
# schovaný za :client:shared/core/telegram a nikde jinde se jeho typy neobjevují.
tdl = "17.0.0"
# Hledání memory leaků v debug buildu (jen `debugImplementation` ve vstupním bodu). 3.0 je zatím
# alpha; 2.14 je poslední stabilní.
leakcanary = "2.14"
# Composition tracing (jen debug): každá composable je v trace Perfetto vlastní řez. Verze musí
# sedět s androidx Compose runtime, na který se JetBrains Compose mapuje (1.12.0), jinak ho povýší.
compose-runtime-tracing = "1.12.0"
# Nativní knihovna Perfetto SDK přibalená do APK, ať se nemusí do zařízení nahrávat zvlášť.
tracing-perfetto = "1.0.1"

