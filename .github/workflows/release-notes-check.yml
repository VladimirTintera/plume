# Každý PR musí přidat do `release-notes/` soubor s poznámkou pro uživatele (cs + en),
# nebo `type: internal`, když uživatel nic nepozná. Z těch souborů skládá release text
# „Co je nového" pro Google Play — formát a důvody v .github/scripts/release_notes.py.
#
# Soubor se vyžaduje i u interních změn: jinak by nešlo odlišit „nic pro uživatele"
# od „zapomněl jsem".
name: Release notes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # VŽDY hostovaný runner, natvrdo, ne repo proměnnou: kontrola běží na `pull_request`,
    # tedy i na PR z cizího forku, a na self-hosted stroji by tam kdokoli pustil vlastní kód
    # (docs/poznatky/release.md, „Runnery"). V soukromém repu to stojí minutu na
    # push do PR, ve veřejném nic.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release note
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          ADDED=$(git diff --diff-filter=A --name-only "$BASE...$HEAD" -- 'release-notes/*.md')
          CHANGED=$(git diff --diff-filter=AM --name-only "$BASE...$HEAD" -- 'release-notes/*.md')
          # Jen komunitní překlady (PR od Weblate) poznámku nepotřebují — pravidlo je ve skriptu.
          if [ -z "$ADDED" ] && python3 .github/scripts/release_notes.py exempt $(git diff --name-only "$BASE...$HEAD"); then
            exit 0
          fi
          if [ -z "$ADDED" ]; then
            echo "::error::PR nepřidává poznámku do release-notes/. Přidej release-notes/<větev>.md s řádky type:/cs:/en: (nebo jen 'type: internal')."
            exit 1
          fi
          python3 .github/scripts/release_notes.py check $CHANGED
