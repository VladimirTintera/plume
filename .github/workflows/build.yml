# Překlad a testy na každém PR (a na `main`, aby se plnila keš Gradlu).
#
# Agent i vývojář před pushem pouští nanejvýš `assembleDebug`; kontroly zdrojáků (`verify*` na
# `check`), testy, desktop a hodinky se dřív ozvaly, až když je někdo náhodou spustil. A protože
# `pull_request` staví SLOUČENÍ s aktuálním `main` (`refs/pull/N/merge`), chytí to i dva PR,
# které každý zvlášť projdou a dohromady se nepřeloží. Proč co je a co není, viz
# docs/poznatky/release.md, „Kontrola PR".
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nový push do téže větve PR zruší rozběhnutý běh; na `main` doběhne každý (plní keš).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR, který nemění nic, co jde do buildu (dokumentace, poznámky k vydání, podklady pro Play),
  # se nestaví. Rozhoduje to tenhle job ze seznamu souborů od GitHub API — bez checkoutu, takže
  # trvá pár sekund; checkout se submoduly a celou historií by sám stál minutu.
  #
  # Filtr `paths-ignore` na úrovni workflow by byl jednodušší, ale workflow, které se nespustí,
  # nechá povinný check navždy ve stavu „čeká" a PR nejde sloučit. PŘESKOČENÝ job (`if` níž)
  # GitHub naopak počítá jako úspěch, takže `Build and test` jde nastavit jako povinný.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Detect build-relevant changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Push do `main` a ruční spuštění se staví vždy (plní keš, ověřují sloučený stav).
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$FILES"
          # Co do buildu nevstupuje. `docs/licenses/` ano (konfigurace AboutLibraries), stejně
          # tak překlady (strings.xml hlídá verifyTranslations) — ty se tedy staví.
          # Poznámky k vydání čte generateChangelog, ale bez nich se build nerozbije (fallback).
          IGNORED='^(docs/|release-notes/|play/(listing|graphics)/|\.claude/)|\.md$|^LICENSE$'
          CODE=$(echo "$FILES" | grep -E '^docs/licenses/' || true)
          CODE="$CODE$(echo "$FILES" | grep -vE "$IGNORED" || true)"
          if [ -z "$CODE" ]; then
            echo "::notice::Jen dokumentace a podobné soubory, build se přeskakuje."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # VŽDY hostovaný runner, natvrdo: běží i na PR z cizího forku (viz release-notes-check.yml).
    # Ve veřejném repu je zdarma a má 4 CPU / 16 GB.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          # ai-engine (external/ai-engine) a v něm llama.cpp; bez nich se projekt ani nenakonfiguruje.
          submodules: recursive
          # Celá historie a tagy: generateChangelog z nich skládá „Co je nového", jako v releasu.
          fetch-depth: 0

      # Verze musí odpovídat `jvmToolchain(17)` v modulech, jinak ji foojay stahuje při každém běhu.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Keš zapisuje jen `main` (výchozí `cache-read-only` mimo výchozí větev), PR ji čtou.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      # Totéž co v android-release.yml: compileSdk 37.2 pro Plume, 37.0 pro ai-engine, NDK
      # a CMake pro llama.cpp (AGP chce NDK už při konfiguraci :ai-llamacpp-android).
      - name: Install Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2 ndk;29.0.13846066 cmake;3.31.0'

      # Projektové gradle.properties počítá s vývojářským strojem (Kotlin daemon 8 GB).
      - name: Limit Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC'
            echo 'kotlin.daemon.jvmargs=-Xmx4g'
          } >> ~/.gradle/gradle.properties

      # `check` = kontroly zdrojáků a překladů, testy commonTest na JVM (androidHostTest, jvmTest)
      # a unit testy vstupních bodů. Bez lintu (`-x lint`): ten tu nikdy neběžel a není jisté,
      # že projde. iOS testy se na Linuxu přeskočí samy. Navíc APK telefonu a hodinek (dex,
      # balení) a jar desktopu. Bez api_id/api_hash: build se přeloží, jen by se nepřihlásil.
      - name: Build and test
        run: |
          ./gradlew --continue \
            check -x lint \
            :client:androidApp:assembleDebug \
            :client:wearApp:assembleDebug \
            :client:desktopApp:jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
