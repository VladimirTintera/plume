// Třídy, které Compose kompilátor sám za stabilní nepovažuje, a přitom se po vzniku nemění.
// Konfigurace místo @Immutable: doménové typy v core/telegram nemají importovat Compose.
// Viz docs/poznatky/vykon.md, „Výkon a paměť".

// ByteArray se po vzniku nemění (jen se čte jako model obrázku); bez toho je nestabilní
// celý řetěz MessageMedia → LinkPreview → ChatMessage.
eu.tintera.plume.core.telegram.Minithumbnail

// Sealed interface: kompilátor ho bere jako „Uncertain", i když jsou obě implementace stabilní
// (data object a data class s Int). Kvůli němu zůstávaly nestabilní Photo, Video, VideoNote
// a LinkPreview.
eu.tintera.plume.core.telegram.SelfDestructType

// Rekurze ChatMessage → ExternalReply → ChatMessage: stabilitu rekurzivního typu kompilátor
// neodvodí a celý ChatMessage pak vede jako nestabilní. Obě třídy jsou data class z `val`.
eu.tintera.plume.core.telegram.ExternalReply

// Sealed interface z data class se Stringem a výčtem; kvůli němu zůstávalo nestabilní kolečko
// (MessageMedia.VideoNote).
eu.tintera.plume.core.telegram.SpeechTranscript

// Řádek seznamu chatů. Pole typu sealed interface (UiText, ChatFolder, Presence, Verification…)
// z něj dělala „runtime" stabilitu, která za běhu vyšla nestabilní: řádky se porovnávaly
// identitou a každá aktualizace seznamu (nové instance) přeskládala všechny viditelné řádky,
// i když se změnil jeden chat. Data class jen z `val`.
eu.tintera.plume.core.telegram.ChatSummary
